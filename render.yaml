# Render blueprint: hosts ORBIT TWIN (website + crew API + SQLite) as one free web service.
# Render → New → Blueprint → pick this repository. Details: README, "Online demo link".
services:
  - type: web
    name: orbit-twin
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run serve
    healthCheckPath: /api/astronauts
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: ORBIT_SESSION_SECRET
        generateValue: true
